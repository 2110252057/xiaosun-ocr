        // 不再硬编码字符串，避免出现多处版本号不一致。
        // versionCode 每次发版必须递增，否则无法覆盖安装旧版本。
        // 2 → 3：1.2 加入「按方向区分菜单/直触」与触发器页的「滑过之后」选项。
