plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.xiaosun.ocr'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xiaosun.ocr'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '2.1'

        // 仅保留 arm64-v8a 与 armeabi-v7a（已移除 x86_64）
        // 说明：libnjocr.so 是预编译产物，放在 jniLibs/ 下直接打包，
        //       不依赖 externalNativeBuild / NDK 编译。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
        // 让 libnjocr.so / libc++_shared.so 解压到 lib 目录，保证依赖库能被正确加载
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // 纯 Java 嵌入式 HTTP 服务器，用于复刻原版 127.0.0.1:1666 的接口协议
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // 仅用于把识别结果序列化成与原版一致的 JSON 文本
    implementation 'com.google.code.gson:gson:2.11.0'
}